name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }

      - name: Validate VS Code bridge extension
        shell: pwsh
        run: |
          node --check ./vscode-extension/extension.js
          if ($LASTEXITCODE -ne 0) { throw 'extension.js failed the syntax check.' }

          $manifest = Get-Content ./vscode-extension/package.json -Raw | ConvertFrom-Json
          foreach ($field in @('name', 'publisher', 'version', 'main', 'engines')) {
            if (-not $manifest.$field) { throw "package.json is missing '$field'." }
          }
          if (-not (Test-Path (Join-Path './vscode-extension' $manifest.main))) {
            throw "package.json 'main' points at a missing file: $($manifest.main)"
          }

      - name: Test bridge and Windows PowerShell UI
        shell: pwsh
        run: |
          node --test .\tests\bridge.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Bridge regression tests failed.' }
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\ui.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell UI tests failed.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\backend.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Backend regression tests failed.' }

      - name: Test prompt assembly
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP 'langhelper-input.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'langhelper-output.txt'
          [IO.File]::WriteAllText($inputPath, '這是一個測試。', [Text.UTF8Encoding]::new($false))

          ./langhelper.ps1 `
            -Features 'POLISH,BILINGUAL_EN_ZHTW' `
            -InputFile $inputPath `
            -OutputFile $outputPath `
            -DryRun

          $assembled = [IO.File]::ReadAllText($outputPath)
          @(
            '[FEATURE: POLISH]',
            '[FEATURE: BILINGUAL_EN_ZHTW]',
            '<clipboard>',
            '這是一個測試。',
            '</clipboard>'
          ) | ForEach-Object {
            if (-not $assembled.Contains($_)) {
              throw "Assembled prompt is missing: $_"
            }
          }
          if ($assembled.Contains('{{PASTE_CLIPBOARD_HERE}}')) {
            throw 'Clipboard placeholder was not replaced.'
          }

      - name: Reminder lists only the enabled features
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP 'reminder-input.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'reminder-output.txt'
          [IO.File]::WriteAllText($inputPath, '測試', [Text.UTF8Encoding]::new($false))

          ./langhelper.ps1 -Features 'BILINGUAL_EN_ZHTW' -InputFile $inputPath -OutputFile $outputPath -DryRun
          $reminder = (([IO.File]::ReadAllText($outputPath)) -split 'REMINDER:')[-1]
          if (-not $reminder.Contains('Enabled features: BILINGUAL_EN_ZHTW.') -or $reminder.Contains('POLISH')) {
            Write-Host $reminder
            throw 'Reminder demanded a Polished section while POLISH was disabled.'
          }

          ./langhelper.ps1 -Features 'POLISH,BILINGUAL_EN_ZHTW' -InputFile $inputPath -OutputFile $outputPath -DryRun
          $reminder = (([IO.File]::ReadAllText($outputPath)) -split 'REMINDER:')[-1]
          if (-not $reminder.Contains('Enabled features: POLISH, BILINGUAL_EN_ZHTW.')) {
            throw 'Reminder is missing enabled features.'
          }
