name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with .github/workflows/release.yml.
  AUTOHOTKEY_VERSION: '2.0.26'
  AUTOHOTKEY_SHA256: '43522AA3122A57784AC5DB30ABF85C2244475C36ACD7796E2C993355F9E926AE'

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }

      - name: Validate AutoHotkey syntax
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'ahk'
          New-Item -ItemType Directory -Path $tools -Force | Out-Null

          gh release download "v$env:AUTOHOTKEY_VERSION" `
            --repo AutoHotkey/AutoHotkey `
            --pattern "AutoHotkey_$env:AUTOHOTKEY_VERSION.zip" `
            --dir $tools

          $archive = Join-Path $tools "AutoHotkey_$env:AUTOHOTKEY_VERSION.zip"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:AUTOHOTKEY_SHA256) {
            throw 'AutoHotkey archive checksum mismatch.'
          }
          Expand-Archive $archive (Join-Path $tools 'bin') -Force

          $exe = Get-ChildItem (Join-Path $tools 'bin') -Filter 'AutoHotkey64.exe' -Recurse |
            Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe was not found.' }

          # /ErrorStdOut keeps a syntax error from opening a dialog that would
          # hang the runner; AutoHotkey is a GUI app so it needs Start-Process.
          $out = Join-Path $env:RUNNER_TEMP 'ahk-validate-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'ahk-validate-err.txt'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @(
            '/ErrorStdOut', '/validate', (Resolve-Path ./langhelper.ahk).Path
          ) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          foreach ($file in @($out, $err)) {
            if (Test-Path $file) { Get-Content $file | Write-Host }
          }
          if ($process.ExitCode -ne 0) {
            throw "AutoHotkey syntax validation failed with exit code $($process.ExitCode)."
          }

      - name: Test prompt assembly
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP 'langhelper-input.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'langhelper-output.txt'
          [IO.File]::WriteAllText($inputPath, '這是一個測試。', [Text.UTF8Encoding]::new($false))

          ./langhelper.ps1 `
            -Features 'POLISH,BILINGUAL_EN_ZHTW' `
            -InputFile $inputPath `
            -OutputFile $outputPath `
            -DryRun

          $assembled = [IO.File]::ReadAllText($outputPath)
          @(
            '[FEATURE: POLISH]',
            '[FEATURE: BILINGUAL_EN_ZHTW]',
            '<clipboard>',
            '這是一個測試。',
            '</clipboard>'
          ) | ForEach-Object {
            if (-not $assembled.Contains($_)) {
              throw "Assembled prompt is missing: $_"
            }
          }
          if ($assembled.Contains('{{PASTE_CLIPBOARD_HERE}}')) {
            throw 'Clipboard placeholder was not replaced.'
          }

      - name: Verify feature catalog matches prompt
        shell: pwsh
        run: |
          $prompt = Get-Content ./prompt.md -Raw
          $ahk = Get-Content ./langhelper.ahk -Raw
          $promptFeatures = [regex]::Matches($prompt, '\[FEATURE:\s*([A-Z0-9_]+)\]') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique
          $ahkFeatures = [regex]::Matches($ahk, '^\s*\["([A-Z0-9_]+)",', 'Multiline') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique

          $difference = Compare-Object $promptFeatures $ahkFeatures
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw 'FeatureCatalog and prompt.md feature blocks do not match.'
          }
